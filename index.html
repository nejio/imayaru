<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>いまやる</title>
<style>
:root{--bg:#14161a;--card:#1f2329;--line:#2d333b;--text:#e8eaed;--sub:#9aa3ad;--acc:#5eead4;--warn:#fb923c;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
header h1{font-size:18px;margin:0}
#score{color:var(--sub);font-size:14px}
main{max-width:640px;margin:0 auto;padding:0 12px}
nav{display:flex;gap:6px;margin:8px 0 14px}
nav button{flex:1;padding:12px;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:12px;font-size:16px}
nav button.on{background:var(--card);color:var(--text);border-color:var(--acc)}
#alerts .al{background:#3a2a1a;border:1px solid var(--warn);color:#ffd9b0;padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:15px}
#alerts .al.bad{background:#3a1d1d;border-color:var(--bad);color:#fecaca}
.focus{background:var(--card);border:2px solid var(--acc);border-radius:20px;padding:22px 18px;text-align:center}
.focus .lbl{color:var(--acc);font-size:14px;letter-spacing:.1em}
.focus .ttl{font-size:26px;font-weight:700;margin:10px 0 6px;word-break:break-word}
.focus .due{color:var(--sub);font-size:15px}
.focus .due.bad{color:var(--bad)}.focus .due.warn{color:var(--warn)}
.focus .step{margin:14px 0 4px;padding:10px;background:#14161a;border-radius:12px;font-size:20px}
.focus .step small{display:block;color:var(--sub);font-size:13px}
.big{display:block;width:100%;padding:18px;margin-top:14px;border:0;border-radius:16px;background:var(--acc);color:#04201c;font-size:22px;font-weight:700}
.row2{display:flex;gap:8px;margin-top:10px}
.sec{flex:1;padding:14px 8px;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:14px;font-size:15px}
.rest{text-align:center;color:var(--sub);margin-top:12px;font-size:14px}
.empty{text-align:center;padding:40px 10px;color:var(--sub);font-size:20px}
h2{font-size:14px;color:var(--sub);margin:18px 4px 6px;font-weight:600}
h2.bad{color:var(--bad)}h2.warn{color:var(--warn)}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.item .chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--sub);background:transparent;flex:none;color:var(--acc);font-size:18px;padding:0}
.item .body{flex:1;min-width:0}
.item .t{word-break:break-word}.item .d{font-size:13px;color:var(--sub)}
.item .d.bad{color:var(--bad)}.item .d.warn{color:var(--warn)}
.item .menu{border:0;background:transparent;color:var(--sub);font-size:22px;padding:6px 8px}
.item.done .t{text-decoration:line-through;color:var(--sub)}
.item.pin{border:1px solid var(--acc)}
#addbar{position:fixed;left:0;right:0;bottom:0;background:#0e1013;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
#addbar input{flex:1;min-width:0;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:17px}
#addbar button{border:0;border-radius:14px;padding:0 16px;font-size:20px;background:var(--card);color:var(--text)}
#addbar #addbtn{background:var(--acc);color:#04201c;font-weight:700;font-size:16px}
#addbar #mic.rec{background:var(--bad)}
#hint{color:var(--sub);font-size:12px;text-align:center;margin-top:16px}
dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:18px;width:min(92vw,420px)}
dialog::backdrop{background:#000a}
dialog input{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid var(--line);background:#14161a;color:var(--text);font-size:17px}
dialog .btns{display:flex;gap:8px}dialog .btns button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:16px}
dialog .btns .p{background:var(--acc);color:#04201c;border:0}dialog .btns .x{color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.tools button{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:14px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--acc);color:#04201c;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#toast.show{opacity:1}
@media (prefers-reduced-motion:no-preference){.focus.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.03)}}}
</style>
</head>
<body>
<header><h1>いまやる</h1><span><span id="score"></span> <small id="syncst" style="color:var(--sub)"></small></span></header>
<main>
  <div id="alerts"></div>
  <nav>
    <button data-tab="now" class="on">いま</button>
    <button data-tab="all">ぜんぶ</button>
    <button data-tab="done">完了・設定</button>
  </nav>
  <div id="view"></div>
</main>
<div id="toast"></div>

<form id="addbar" autocomplete="off">
  <input id="inp" placeholder="思いついたら、ここに一行（例: 明日15時 歯医者）" enterkeyhint="send">
  <button type="button" id="mic" title="音声で入力">🎤</button>
  <button type="submit" id="addbtn">追加</button>
</form>

<dialog id="dlg">
  <form method="dialog" id="dlgform">
    <label>やること</label><input id="d_title">
    <label>期限（空欄で期限なし）</label><input id="d_due" type="datetime-local">
    <label><input type="checkbox" id="d_notime" style="width:auto;margin:0 6px 0 0">時刻なし（日付だけ）</label>
    <div class="btns" style="margin-top:14px">
      <button type="button" class="x" id="d_del">削除</button>
      <button type="button" id="d_cancel">やめる</button>
      <button type="button" class="p" id="d_save">保存</button>
    </div>
  </form>
</dialog>

<script>
'use strict';
/* ========== データ ========== */
const KEY = 'imayaru.v1';
let S = load();
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.tasks)) { s.tombs = s.tombs || []; return s; } } catch(e){}
  return { tasks: [], doneLog: [], tombs: [] };
}
const CFG_KEY = 'imayaru.cfg', SNAP_KEY = 'imayaru.snap';
const VAPID_PUBLIC = 'BI6MGHsEjFpXZ8Jx30NloHIbGCMHVGl-yyMhe4FJ5gg75Uhn1g2UfPWgz1c4llR642VDXhmaRiMrQS1vbYQgdYU';
const readLS = (k) => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch(e){ return {}; } };
let cfg = readLS(CFG_KEY), snap = readLS(SNAP_KEY), ver = 0;
function saveCfg(){
  try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch(e){}
  if (window.caches) caches.open('imayaru-cfg').then(c => c.put('cfg', new Response(JSON.stringify({ url: cfg.url, token: cfg.token })))).catch(() => {});
}
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem(SNAP_KEY, JSON.stringify(snap)); } catch(e){ toast('保存できませんでした'); }
}
// 変更のあったタスクだけ更新時刻(u)を進める。消したものは墓標(tombs)に残して同期する
function save(){
  const now = Date.now(), ids = new Set(); ver++;
  S.tasks.forEach(t => { ids.add(t.id); const j = JSON.stringify({ ...t, u: 0 }); if (snap[t.id] !== j) { t.u = now; snap[t.id] = j; } });
  Object.keys(snap).forEach(id => { if (!ids.has(id)) { delete snap[id]; if (!S.tombs.some(x => x.id === id)) S.tombs.push({ id, del: true, u: now }); } });
  persist(); queueSync();
}
/* ========== サーバー同期 ========== */
let syncT = null, syncing = false;
const setSync = m => { const e = document.getElementById('syncst'); if (e) e.textContent = m; };
function queueSync(){ if (!cfg.url) return; clearTimeout(syncT); syncT = setTimeout(sync, 1500); }
async function sync(){
  if (!cfg.url || syncing || !navigator.onLine) return;
  if (document.getElementById('dlg').open || (document.activeElement && document.activeElement.id === 'stepinp')) { queueSync(); return; }
  syncing = true; const v0 = ver;
  try {
    const r = await fetch(cfg.url + '/api/sync', { method: 'POST', headers: { Authorization: 'Bearer ' + cfg.token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ tasks: S.tasks.concat(S.tombs) }) });
    if (!r.ok) throw new Error(r.status);
    const { tasks } = await r.json();
    if (v0 !== ver) { queueSync(); return; }           // 通信中に手元で変更があったら、結果は捨てて取り直す
    const cut = Date.now() - 30 * 864e5, live = [], tombs = [];
    tasks.forEach(t => { if (t.del) { if (t.u > cut) tombs.push({ id: t.id, del: true, u: t.u }); } else live.push(t); });
    S.tasks = live; S.tombs = tombs; snap = {};
    live.forEach(t => { snap[t.id] = JSON.stringify({ ...t, u: 0 }); });
    // 声で入れた受信箱の項目から日付・時刻を拾う
    let ch = false;
    S.tasks.forEach(t => { if (t.inbox) { const p = parse(t.title); t.title = p.title; t.due = p.due; t.hasTime = p.hasTime; delete t.inbox; ch = true; } });
    if (ch) save(); else persist();
    setSync('同期OK'); render();
  } catch(e){ setSync('未同期'); }
  finally { syncing = false; }
}
function urlB64(b){ const p = '='.repeat((4 - b.length % 4) % 4), x = atob((b + p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(x, c => c.charCodeAt(0)); }
async function enablePush(){
  if (!cfg.url) { toast('先にサーバーを設定してください'); return; }
  try {
    if ((await Notification.requestPermission()) !== 'granted') { toast('通知が許可されていません'); return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(VAPID_PUBLIC) });
    const r = await fetch(cfg.url + '/api/subscribe', { method: 'POST', headers: { Authorization: 'Bearer ' + cfg.token, 'Content-Type': 'application/json' }, body: JSON.stringify({ subscription: sub.toJSON() }) });
    cfg.push = r.ok; saveCfg(); toast(r.ok ? '通知をオンにした' : '登録に失敗'); render();
  } catch(e){ toast('通知の登録に失敗: ' + (e.message || e)); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab = 'now';

/* ========== 一行入力の解釈（日付・時刻を拾う） ========== */
function parse(text){
  let s = text.trim(), now = new Date(), date = null, hh = null, mm = 0;
  const cut = re => { const m = s.match(re); if (m) s = s.replace(re, ' '); return m; };
  const day = n => { const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + n); return d; };
  let m;
  if (cut(/明後日|あさって/)) date = day(2);
  else if (cut(/明日|あした/)) date = day(1);
  else if (cut(/今日|きょう/)) date = day(0);
  else if ((m = cut(/(来週)?の?([月火水木金土日])曜日?/))) {
    const t = '日月火水木金土'.indexOf(m[2]); let diff = (t - now.getDay() + 7) % 7;
    if (diff === 0) diff = 7; if (m[1] && diff < 7 - now.getDay() + 1 && now.getDay() !== 0) diff += 7;
    date = day(diff);
  }
  else if ((m = cut(/(\d{1,2})[\/月](\d{1,2})日?/))) {
    date = new Date(now.getFullYear(), +m[1]-1, +m[2]);
    if (date < day(0)) date.setFullYear(date.getFullYear()+1);
  }
  if ((m = cut(/(\d{1,2}):(\d{2})/))) { hh = +m[1]; mm = +m[2]; }
  else if ((m = cut(/(午前|午後)?(\d{1,2})時(半|(\d{1,2})分?)?/))) {
    hh = +m[2]; mm = m[3] === '半' ? 30 : (m[4] ? +m[4] : 0);
    if (m[1] === '午後' && hh < 12) hh += 12; else if (!m[1] && hh >= 1 && hh <= 6) hh += 12;
  }
  let due = null, hasTime = false;
  if (hh !== null) {
    hasTime = true;
    const base = date || day(0);
    due = new Date(base.getFullYear(), base.getMonth(), base.getDate(), hh, mm).getTime();
    if (!date && due < Date.now()) due += 86400000;
  } else if (date) due = date.getTime();
  const title = s.replace(/\s+/g,' ').replace(/^[\sに:、,の]+|[\sに:、,]+$/g,'').trim() || text.trim();
  return { title, due, hasTime };
}

/* ========== タスク操作 ========== */
const open = () => S.tasks.filter(t => !t.done);
function endOf(t){ // 期限切れの境目
  if (!t.due) return Infinity;
  return t.hasTime ? t.due : t.due + 86400000;
}
// 日付だけの期限は、その日の9時（通知と同じ）として並べる
function sortKey(t){ return !t.due ? 9e15 : t.hasTime ? t.due : t.due + 9*3600000; }
function order(){ // 「いま」の優先順
  const n = Date.now();
  return open().filter(t => !t.snooze || t.snooze <= n).sort((a,b) =>
    (b.pin?1:0) - (a.pin?1:0) || sortKey(a) - sortKey(b) || a.created - b.created);
}
function addTask(text){
  const p = parse(text); if (!p.title) return;
  S.tasks.push({ id: uid(), title: p.title, due: p.due, hasTime: p.hasTime, done: false, created: Date.now(), steps: [], notified: {} });
  save(); toast('覚えた ✓'); render();
}
function complete(t){
  t.done = true; t.doneAt = Date.now(); t.pin = false;
  S.doneLog.push(t.doneAt); save();
  toast(['いいね！','ナイス！','できた！','えらい！','1個クリア！'][Math.floor(Math.random()*5)]);
  render(true);
}
function fmtDue(t){
  if (!t.due) return '';
  const d = new Date(t.due), n = new Date();
  const days = Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - new Date(n.getFullYear(),n.getMonth(),n.getDate())) / 86400000);
  const wd = '日月火水木金土'[d.getDay()];
  let l = days === 0 ? '今日' : days === 1 ? '明日' : days === 2 ? '明後日' : days === -1 ? '昨日' : `${d.getMonth()+1}/${d.getDate()}(${wd})`;
  if (t.hasTime) l += ` ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
  return l;
}
function dueClass(t){
  if (!t.due) return '';
  const left = endOf(t) - Date.now();
  if (left < 0) return 'bad';
  if (left < 3*3600000 || (!t.hasTime && t.due <= Date.now() + 86400000)) return 'warn';
  return '';
}
function doneToday(){
  const s = new Date(); s.setHours(0,0,0,0);
  return S.doneLog.filter(x => x >= s.getTime()).length;
}

/* ========== 描画 ========== */
function render(pop){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#score').textContent = doneToday() ? `今日 ${doneToday()}個 できた` : '';
  renderAlerts();
  if (tab === 'now') viewNow(pop); else if (tab === 'all') viewAll(); else viewDone();
}
function renderAlerts(){
  const n = Date.now(), od = open().filter(t => endOf(t) < n).length;
  const soon = open().filter(t => t.hasTime && t.due >= n && t.due - n < 3600000).length;
  let h = '';
  if (od) h += `<div class="al bad">期限が過ぎているのが ${od}件 あります（「ぜんぶ」で確認）</div>`;
  if (soon) h += `<div class="al">1時間以内の予定が ${soon}件 あります</div>`;
  if (cfg.url && !cfg.push) h += `<div class="al" id="askn" style="cursor:pointer">🔔 タップで通知をオン（アプリを閉じていても届きます）</div>`;
  else if (!cfg.url) h += `<div class="al" id="askn" style="cursor:pointer">⚙ サーバー未設定。タップして設定リンクを貼る</div>`;
  $('#alerts').innerHTML = h;
  const a = $('#askn'); if (a) a.onclick = () => cfg.url ? enablePush() : (tab = 'done', render());
}
function viewNow(pop){
  const list = order(), t = list[0], v = $('#view');
  if (!t) {
    const later = open().length;
    v.innerHTML = `<div class="empty">${later ? 'いまは あとで待ちだけ。<br>休んでOK 🍵' : 'ぜんぶ おわり 🎉<br>休んでOK'}</div>`;
    return;
  }
  const step = t.steps.find(s => !s.done), due = fmtDue(t);
  v.innerHTML = `
  <div class="focus ${pop?'pop':''}">
    <div class="lbl">いま、これだけ</div>
    <div class="ttl">${esc(t.title)}</div>
    ${due ? `<div class="due ${dueClass(t)}">${dueClass(t)==='bad'?'期限切れ ':'期限 '}${due}</div>` : ''}
    ${step ? `<div class="step"><small>最初の一歩</small>${esc(step.t)}</div>` : ''}
    <button class="big" id="b_done">${step ? '✅ この一歩 できた' : '✅ できた'}</button>
    <div class="row2">
      <button class="sec" id="b_later">⏭ あとで<br><small>1時間</small></button>
      <button class="sec" id="b_tom">🌙 明日<br><small>朝に出す</small></button>
      <button class="sec" id="b_drop">🗑 もういい<br><small>捨てる</small></button>
    </div>
    <div class="row2">
      <button class="sec" id="b_split">✂ 小さくする<br><small>最初の一歩</small></button>
      <button class="sec" id="b_pin">${t.pin ? '📌 固定を解除' : '📍 これで固定'}<br><small>${t.pin ? '押すと解除' : '動かさない'}</small></button>
    </div>
    <div id="splitbox"></div>
  </div>
  <div class="rest">${list.length > 1 ? `ほかに ${list.length-1}件（見なくてOK）` : ''}</div>`;
  $('#b_done').onclick = () => {
    if (step) { step.done = true; save(); t.steps.every(s => s.done) ? complete(t) : (toast('一歩 すすんだ ✓'), render(true)); }
    else complete(t);
  };
  $('#b_later').onclick = () => { t.snooze = Date.now() + 3600000; t.pin = false; save(); toast('1時間あとに回した'); render(); };
  $('#b_tom').onclick = () => { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(8,0,0,0); t.snooze = d.getTime(); t.pin = false; save(); toast('明日の朝に回した'); render(); };
  $('#b_drop').onclick = () => { S.tasks = S.tasks.filter(x => x !== t); save(); toast('捨てた。気にしない'); render(); };
  $('#b_pin').onclick = () => { const on = !t.pin; S.tasks.forEach(x => x.pin = false); t.pin = on; save(); toast(on ? '固定した' : '固定を解除した'); render(); };
  $('#b_split').onclick = () => {
    $('#splitbox').innerHTML = `<input id="stepinp" placeholder="30秒でできる最初の一歩は？" style="width:100%;margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#14161a;color:var(--text);font-size:17px">`;
    const i = $('#stepinp'); i.focus();
    i.onkeydown = e => { if (e.key === 'Enter' && i.value.trim()) { e.preventDefault(); t.steps.push({ t: i.value.trim(), done: false }); save(); render(); } };
  };
}
function itemHtml(t){
  const d = fmtDue(t), c = dueClass(t);
  return `<div class="item ${t.done?'done':''} ${t.pin?'pin':''}" data-id="${t.id}">
    <button class="chk" data-a="chk">${t.done?'✓':''}</button>
    <div class="body" data-a="edit"><div class="t">${esc(t.title)}</div>
      ${(d || t.steps.length) ? `<div class="d ${c}">${d}${d && t.steps.length?' ・ ':''}${t.steps.length?`一歩 ${t.steps.filter(s=>s.done).length}/${t.steps.length}`:''}</div>` : ''}</div>
    ${t.done ? '' : `<button class="menu" data-a="pin" title="いま やる">${t.pin?'📌':'📍'}</button>`}
  </div>`;
}
function viewAll(){
  const n = Date.now(), tasks = open();
  const od = tasks.filter(t => endOf(t) < n).sort((a,b)=>a.due-b.due);
  const rest = tasks.filter(t => endOf(t) >= n);
  const todayEnd = new Date(); todayEnd.setHours(23,59,59,999);
  const today = rest.filter(t => t.due && t.due <= todayEnd.getTime()).sort((a,b)=>a.due-b.due);
  const future = rest.filter(t => t.due && t.due > todayEnd.getTime()).sort((a,b)=>a.due-b.due);
  const none = rest.filter(t => !t.due).sort((a,b)=>b.created-a.created);
  const sec = (title, arr, cls='') => arr.length ? `<h2 class="${cls}">${title}（${arr.length}）</h2>${arr.map(itemHtml).join('')}` : '';
  $('#view').innerHTML = (tasks.length ? sec('期限切れ', od, 'bad') + sec('今日', today, 'warn') + sec('これから', future) + sec('期限なし（思いつき）', none)
    : '<div class="empty">空っぽ。気が楽。</div>') + '<div id="hint">左の○で完了 ／ 文字をタップで編集 ／ 📍で「いま」に出す</div>';
}
function viewDone(){
  const done = S.tasks.filter(t => t.done).sort((a,b)=>b.doneAt-a.doneAt).slice(0,30);
  $('#view').innerHTML = (done.length ? `<h2>最近できたこと</h2>${done.map(itemHtml).join('')}` : '<div class="empty" style="font-size:16px">まだ完了はありません</div>') + `
  <div class="tools">
    <button id="t_exp">📤 バックアップを保存</button>
    <button id="t_imp">📥 バックアップから戻す</button>
    <button id="t_clr">🧹 完了を全部消す</button>
  </div><input type="file" id="t_file" accept="application/json" hidden>
  <h2>サーバー連携</h2>
  <div class="item"><div class="body"><div class="t">${cfg.url ? 'つながっています' : '未設定'} ${cfg.push ? '・通知オン' : ''}</div>
    <div class="d">${cfg.url ? esc(cfg.url) : '設定リンクを開くと入ります'}</div></div></div>
  ${cfg.url ? '' : `<div style="margin-top:10px"><div class="d" style="color:var(--sub);font-size:14px">設定リンクをコピーして、ここに貼り付けてください</div>
    <input id="setupinp" placeholder="https://nejio.github.io/imayaru/#setup=…" style="width:100%;margin-top:6px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#14161a;color:var(--text);font-size:16px">
    <button class="big" id="setupbtn" style="font-size:18px;padding:14px">この設定を入れる</button></div>`}
  <div class="tools"><button id="t_sync">🔄 今すぐ同期</button><button id="t_push">🔔 通知をオン</button><button id="t_test">📨 テスト通知</button></div>
  <div id="hint">データはサーバーと同期されます。バックアップは念のため残してあります。</div>`;
  const sb = $('#setupbtn'); if (sb) sb.onclick = () => { if (applySetup($('#setupinp').value)) { toast('サーバー設定を入れた'); render(); } else toast('リンクが読み取れません。全部コピーできていますか？'); };
  $('#t_sync').onclick = () => { sync(); toast('同期する'); };
  $('#t_push').onclick = enablePush;
  $('#t_test').onclick = () => fetch(cfg.url + '/api/test', { method: 'POST', headers: { Authorization: 'Bearer ' + cfg.token } }).then(r => r.json()).then(j => toast(j.sent ? 'テスト通知を送った' : '送れなかった（通知をオンにしてください）')).catch(() => toast('サーバーに届かない'));
  $('#t_exp').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S,null,1)], { type: 'application/json' }));
    a.download = `imayaru-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
  };
  $('#t_imp').onclick = () => $('#t_file').click();
  $('#t_file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(x => { const j = JSON.parse(x); if (!Array.isArray(j.tasks)) throw 0; if (confirm('今のデータを置き換えます。よろしいですか？')) { S = { tasks: j.tasks, doneLog: j.doneLog || [] }; save(); render(); } }).catch(() => toast('読み込めませんでした'));
  };
  $('#t_clr').onclick = () => { if (confirm('完了したものを全部消します。よろしいですか？')) { S.tasks = S.tasks.filter(t => !t.done); save(); render(); } };
}

/* ========== イベント ========== */
$('#view').addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const it = el.closest('.item'), t = S.tasks.find(x => x.id === it.dataset.id); if (!t) return;
  const a = el.dataset.a;
  if (a === 'chk') { if (t.done) { t.done = false; save(); render(); } else complete(t); }
  else if (a === 'pin') { S.tasks.forEach(x => x.pin = false); t.pin = !t.pin; t.snooze = 0; save(); toast(t.pin ? '「いま」に出した' : '解除'); render(); }
  else if (a === 'edit') openEdit(t);
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
$('#addbar').addEventListener('submit', e => {
  e.preventDefault(); const v = $('#inp').value; if (!v.trim()) return;
  addTask(v); $('#inp').value = ''; $('#inp').focus();
});

/* 音声入力（対応ブラウザのみ） */
(() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition, mic = $('#mic');
  if (!SR) { mic.style.display = 'none'; return; }
  let r = null, rec = false, backup = '', timer = null;
  const setRec = on => { rec = on; mic.classList.toggle('rec', on); mic.textContent = on ? '■' : '🎤'; mic.title = on ? 'タップで中止' : '音声で入力'; };
  // 止まらない端末対策: 画面は必ず先に戻し、認識は止める・捨てる・触らないの順で確実に終わらせる
  function stopRec(keep){
    clearTimeout(timer); timer = null;
    const old = r; r = null; setRec(false);
    if (!keep) $('#inp').value = backup;
    if (old) { old.onresult = old.onend = old.onerror = null; try { old.abort(); } catch(e){} try { old.stop(); } catch(e){} }
  }
  mic.onclick = () => {
    if (rec) { stopRec(false); toast('音声入力を中止'); return; }
    backup = $('#inp').value;
    r = new SR(); r.lang = 'ja-JP'; r.continuous = false; r.interimResults = true;
    r.onresult = e => { $('#inp').value = Array.from(e.results).map(x => x[0].transcript).join(''); };
    r.onend = () => stopRec(true);
    r.onerror = () => stopRec(true);
    try { r.start(); setRec(true); timer = setTimeout(() => { stopRec(true); toast('音声入力を終了'); }, 15000); } catch(e){ stopRec(false); }
  };
  document.addEventListener('visibilitychange', () => { if (document.hidden && rec) stopRec(false); });
})();

/* 編集ダイアログ */
let editing = null;
const pad = n => String(n).padStart(2,'0');
function openEdit(t){
  editing = t; $('#d_title').value = t.title;
  if (t.due) { const d = new Date(t.due); $('#d_due').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${t.hasTime ? pad(d.getHours())+':'+pad(d.getMinutes()) : '00:00'}`; }
  else $('#d_due').value = '';
  $('#d_notime').checked = t.due ? !t.hasTime : false; $('#dlg').showModal();
}
$('#d_cancel').onclick = () => $('#dlg').close();
$('#d_del').onclick = () => { if (confirm('削除しますか？')) { S.tasks = S.tasks.filter(x => x !== editing); save(); $('#dlg').close(); render(); } };
$('#d_save').onclick = () => {
  const v = $('#d_due').value; editing.title = $('#d_title').value.trim() || editing.title;
  if (v) { editing.hasTime = !$('#d_notime').checked; editing.due = new Date(v).getTime(); if (!editing.hasTime) { const d = new Date(editing.due); editing.due = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); } }
  else { editing.due = null; editing.hasTime = false; }
  editing.notified = {}; editing.snooze = 0; save(); $('#dlg').close(); render();
};

/* ========== 通知（アプリを開いている間） ========== */
function notify(title, body){
  toast(title);
  if (navigator.vibrate) navigator.vibrate([200,100,200]);
  if (!cfg.push && 'Notification' in window && Notification.permission === 'granted') {
    if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r => r.showNotification(title, { body, tag: title + body })).catch(() => new Notification(title, { body }));
    else new Notification(title, { body });
  }
}
function tick(){
  const n = Date.now(); let changed = false;
  open().forEach(t => {
    if (!t.due) return; t.notified = t.notified || {};
    const at = t.hasTime ? t.due : t.due + 9*3600000; // 日付だけの予定は当日9時
    if (t.hasTime && !t.notified.pre && n >= at - 10*60000 && n < at) { t.notified.pre = 1; changed = true; notify('もうすぐ: ' + t.title, '10分前です'); }
    if (!t.notified.at && n >= at && n < endOf(t)) { t.notified.at = 1; changed = true; notify('今日: ' + t.title, t.hasTime ? '時間です' : '今日が期限です'); }
  });
  if (changed) { save(); render(); }
}
setInterval(tick, 30000); setInterval(() => { if (!document.hidden && tab !== 'all') render(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); render(); sync(); } });

/* ========== 補助 ========== */
let tt; function toast(m){ const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 1600); }
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
function applySetup(text){ // 設定リンク（または #setup= 以降の文字列）からサーバー設定を入れる
  const m = String(text).trim().match(/(?:#setup=)?([A-Za-z0-9+\/=_-]{20,})$/);
  if (!m) return false;
  try { const o = JSON.parse(decodeURIComponent(escape(atob(m[1])))); if (o.u && o.t) { cfg.url = o.u.replace(/\/$/, ''); cfg.token = o.t; saveCfg(); sync(); return true; } } catch(e){}
  return false;
}
(() => {
  const m = location.hash.match(/^#setup=(.+)$/);
  if (m) { try { const o = JSON.parse(decodeURIComponent(escape(atob(m[1])))); if (o.u && o.t) { cfg.url = o.u.replace(/\/$/, ''); cfg.token = o.t; saveCfg(); history.replaceState(null, '', location.pathname); toast('サーバー設定を入れた'); } } catch(e){} }
})();
saveCfg(); render(); tick(); sync(); $('#inp').focus();
setInterval(() => { if (!document.hidden) sync(); }, 60000);
</script>
</body>
</html>
